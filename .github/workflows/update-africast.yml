name: Update africast submodule

# Keeps the africast submodule (tracking workshop-f4sg-africast's gh-pages
# branch, per .gitmodules) pointed at its latest commit, and publishes the
# result on main (this repo's own site branch).
#
# Triggers:
#   - repository_dispatch from workshop-f4sg-africast's own workflow, sent
#     right after it publishes to gh-pages. See
#     ../../workshop-f4sg-africast/.github/workflows/notify-workshops-hub.yml
#     for that side, and its header for the one-time PAT/secret setup.
#   - a scheduled poll (weekly), as a fallback in case a dispatch is missed
#     or the source repo's notify workflow is ever removed.
#   - workflow_dispatch, for a manual run.
on:
  repository_dispatch:
    types: [gh-pages-updated]
  schedule:
    - cron: "0 0 * * 0" # weekly, Sunday 00:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-africast
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # submodules: true is needed here even though it only gets us a
          # --depth=1 fetch of the pinned commit (see below): it's what sets
          # up the git@github.com: -> https://github.com/ URL rewrite and
          # persists checkout's auth token into the submodule's local git
          # config, since .gitmodules points at africast over SSH and the
          # runner has no SSH key for it.
          submodules: true
          persist-credentials: true

      - name: Fetch latest africast commit
        # actions/checkout's submodule fetch above is --depth=1 against the
        # currently pinned commit, which never creates an origin/gh-pages
        # remote-tracking ref -- `submodule update --remote` needs one
        # ("Unable to find refs/remotes/origin/gh-pages revision"). Fetch it
        # explicitly (reusing the credentials/URL-rewrite already set up by
        # checkout above) before asking `--remote` to resolve it.
        run: |
          git submodule sync --recursive
          git -C africast fetch origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
          git submodule update --remote --recursive

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add africast
          if git diff --cached --quiet; then
            echo "Nothing to update -- africast is already up to date."
          else
            git commit -m "Update africast submodule

          Triggered by: ${{ github.event_name }}${{ github.event.client_payload.repo && format(' from {0}', github.event.client_payload.repo) || '' }}"
            # Retry with a rebase in case main moved since checkout (an
            # unrelated push landing mid-run) -- this commit only touches
            # the submodule pointer, so rebasing it is always safe.
            for i in 1 2 3; do
              git push origin HEAD:main && break
              git fetch origin main
              git rebase origin/main
            done
          fi
